<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
</head>
<body>
    <div id="padre">
        Elemento padre
        <div id="hijo">Elemento hijo</div>
    </div>
    <script>
        const elementoHijo=document.getElementById('hijo')
        elementoHijo.addEventListener('click', (evento)=>{
            evento.stopPropagation()
            alert('Evento Hijo')
        })
        const elementoPadre=document.getElementById('padre')
        elementoPadre.addEventListener('click', (evento)=>{
            alert('Evento Padre')
        })
    </script>
</body>
</html>
