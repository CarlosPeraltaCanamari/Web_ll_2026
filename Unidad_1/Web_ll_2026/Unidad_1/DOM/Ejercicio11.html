<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>
<body>
    <div id="contenedor">
        <div id="eliminar">Eliminar</div>
    </div>
    <script>
        const elementoEliminar=document.getElementById('eliminar')
        const elementoPadre=elementoEliminar.parentElement; //Identifica quien es el padre
        elementoPadre.removeChild(elementoEliminar)
    </script>
</body>
</html>
